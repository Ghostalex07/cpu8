# Configuracion de Ruff para el codigo Python de cpu8 (ensamblador, herramientas
# y tests).  Se mantiene un conjunto CONSERVADOR de reglas: solo errores reales
# (sintaxis, nombres indefinidos, imports sin usar, f-strings mal formadas),
# sin imponer reformateos masivos al codigo ya existente.
#
#   ruff check .          # o:  make lint
#
# Para un chequeo mas estricto en local:  ruff check . --select ALL

target-version = "py310"
line-length = 100

[lint]
select = ["E4", "E7", "E9", "F"]
# Los scripts ajustan sys.path antes de importar (patron intencional): E402.
ignore = ["E402"]
