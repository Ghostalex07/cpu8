# Ruff configuration for the Python code of cpu8 (assembler, tools and tests).
# A CONSERVATIVE set of rules is kept: only real errors (syntax, undefined
# names, unused imports, malformed f-strings), without imposing massive
# reformatting on the existing code.
#
#   ruff check .          # or:  make lint
#
# For a stricter check locally:  ruff check . --select ALL

target-version = "py310"
line-length = 100

[lint]
select = ["E4", "E7", "E9", "F"]
# The scripts adjust sys.path before importing (intentional pattern): E402.
ignore = ["E402"]
