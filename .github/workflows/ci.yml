name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    # Pinned to 24.04 (not ubuntu-latest) so the runner does not change the
    # iverilog/verilator version unexpectedly when ubuntu-latest migrates to 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    # The project Makefile is in cpu8/, not at the repository root.
    defaults:
      run:
        working-directory: cpu8

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator
          python3 -m pip install --quiet pytest ruff

      - name: Verilator lint
        run: make vlint

      - name: Python lint (ruff)
        run: make lint

      - name: Module tests (ALU/PC/RAM/regfile)
        run: make modtests

      - name: Program tests
        run: make progtests

      - name: IRQ test
        run: make irqtest

      - name: Verilator tests
        run: make verilator

      - name: Python tests (assembler + ISA table + disassembler + ISS)
        run: make pytools

      - name: ISA docs up to date (docs/OPCODES.md)
        run: make docs-check

      - name: Differential fuzz (RTL vs reference model)
        run: make difftest COUNT=150 SEED=1

      - name: Regression harness (bytes + trace + fuzz)
        run: make regress

  # Synthesis needs the iCE40 toolchain and is slow, so it runs in its own job
  # instead of blocking the fast test suite. The budget check fails the build
  # if the design outgrows the iCE40HX1K or misses the 12 MHz timing target.
  fpga:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: cpu8

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install iCE40 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys nextpnr-ice40 icestorm

      - name: Synthesize, place and route (iCE40HX1K)
        run: |
          set -o pipefail
          mkdir -p build
          make fpga 2>&1 | tee build/fpga.log

      - name: FPGA area and timing budget
        run: python3 tools/fpga_report.py build/fpga.log
