name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    # Pinned to 24.04 (not ubuntu-latest) so the runner does not change the
    # iverilog/verilator version unexpectedly when ubuntu-latest migrates to 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    # The project Makefile is in cpu8/, not at the repository root.
    defaults:
      run:
        working-directory: cpu8

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator
          python3 -m pip install --quiet pytest ruff

      - name: Verilator lint
        run: make vlint

      - name: Python lint (ruff)
        run: make lint

      - name: Module tests (ALU/PC/RAM/regfile)
        run: make modtests

      - name: Program tests
        run: make progtests

      - name: IRQ test
        run: make irqtest

      - name: Verilator tests
        run: make verilator

      - name: Python tests (assembler + ISA table + disassembler + ISS)
        run: make pytools

      - name: ISA docs up to date (docs/OPCODES.md)
        run: make docs-check

      - name: Differential fuzz (RTL vs reference model)
        run: make difftest COUNT=150 SEED=1

      - name: Regression harness (bytes + trace + fuzz)
        run: make regress

  # Synthesis needs the iCE40 toolchain and is slow, so it runs in its own job
  # instead of blocking the fast test suite. The budget check fails the build
  # if the design outgrows the iCE40HX1K or misses the 12 MHz timing target.
  fpga:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: cpu8

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # The distro toolchain is not used here on purpose: nextpnr 0.6 (Ubuntu
      # 24.04) places the design at 11.35 MHz, below the 12 MHz target, and then
      # exits with an error.  The YoWASP wheels carry the same yosys/nextpnr
      # (0.70 / 0.11) the design is calibrated against, so the budget check is
      # meaningful.  The versions are pinned to keep the check reproducible;
      # bump them deliberately when a new release is known to still fit.
      - name: Install iCE40 toolchain (YoWASP)
        run: |
          python3 -m pip install --quiet \
            'yowasp-yosys==0.69.0.0.post1233' \
            'yowasp-nextpnr-ice40==0.11.1.0.post826'
          yowasp-yosys -V
          yowasp-nextpnr-ice40 --version

      - name: Synthesize, place and route (iCE40HX1K)
        run: |
          set -o pipefail
          mkdir -p build
          make fpga 2>&1 | tee build/fpga.log

      - name: FPGA area and timing budget
        run: python3 tools/fpga_report.py build/fpga.log
