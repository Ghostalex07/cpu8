name: CI

# The jobs only need to read the repository (checkout and local tools); no job
# writes to the API, so keep the default token read-only.
permissions:
  contents: read

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # The long differential fuzz runs overnight on the default branch; the
  # regular jobs run on the scheduled event too and act as a daily regression.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      long:
        description: 'Also run the long differential fuzz (COUNT=10000)'
        type: boolean
        default: false

# Cancel the superseded runs of a branch/PR that is being pushed to quickly;
# a run that is already on main is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    # Pinned to 24.04 (not ubuntu-latest) so the runner does not change the
    # iverilog/verilator version unexpectedly when ubuntu-latest migrates to 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    # The project Makefile is in cpu8/, not at the repository root.
    defaults:
      run:
        working-directory: cpu8

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: .github/requirements-ci.txt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator
          python3 -m pip install --quiet -r ../.github/requirements-ci.txt

      - name: Verilator lint
        run: make vlint

      - name: Python lint (ruff)
        run: make lint

      - name: Module tests (ALU/PC/RAM/regfile)
        run: make modtests

      - name: Program tests
        run: make progtests

      - name: IRQ test
        run: make irqtest

      - name: Verilator tests
        run: make verilator

      - name: Python unit tests (assembler, ISA table, disassembler, ISS, debugger, FPGA report)
        run: make pytools

      - name: ISA docs up to date (docs/OPCODES.md)
        run: make docs-check

      - name: Differential fuzz (RTL vs reference model)
        run: make difftest COUNT=150 SEED=1

      - name: Regression harness (bytes + trace + fuzz)
        run: make regress

      # Both harnesses save the failing programs (and their traces) under
      # build/; the short console output is not enough to reproduce a failure,
      # so keep them when the job fails.
      - name: Upload the differential fuzz failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: difftest-failures
          path: cpu8/build/difftest-fallos/
          if-no-files-found: ignore

      - name: Upload the regression failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: regress-failures
          path: cpu8/build/regress/
          if-no-files-found: ignore

  # Verible formatting is a pure text check and does not need iverilog, so it
  # gets its own fast, independent job.  `verible==0.0.4071.0` is pinned in
  # .github/requirements-ci.txt; the sources are formatted with exactly that
  # version, so the check is reproducible.
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    defaults:
      run:
        working-directory: cpu8

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: .github/requirements-ci.txt

      - name: Install dependencies
        run: python3 -m pip install --quiet -r ../.github/requirements-ci.txt

      - name: Verilog formatting (Verible)
        run: make fmt-check

  # The ALU equivalence and FSM proofs are fast (~1 min) but need a solver and
  # the YoWASP Yosys/SymbiYosys stack, so they get their own job.
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: cpu8

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: .github/requirements-formal.txt

      - name: Install SymbiYosys and z3
        run: |
          python3 -m pip install --quiet -r ../.github/requirements-formal.txt
          yowasp-sby --help >/dev/null
          z3 --version

      - name: Formal proofs (ALU and FSM)
        run: make formal

  # Synthesis needs the iCE40 toolchain and is slow, so it runs in its own job
  # instead of blocking the fast test suite.  The budget check fails the build
  # if the design outgrows the iCE40HX1K or misses the 12 MHz timing target.
  fpga:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: cpu8

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          # The YoWASP wheels are ~85 MB; caching them saves most of the
          # install time and, more importantly, makes the job robust against
          # PyPI hiccups.
          cache: 'pip'
          cache-dependency-path: .github/requirements-fpga.txt

      # The distro toolchain is not used here on purpose: nextpnr 0.6 (Ubuntu
      # 24.04) places the design at 11.35 MHz, below the 12 MHz target, and then
      # exits with an error.  The YoWASP wheels carry the same yosys/nextpnr
      # the design is calibrated against, so the budget check is meaningful.
      # The versions are pinned in .github/requirements-fpga.txt to keep the
      # check reproducible; bump them deliberately when a new release is known
      # to still fit.
      - name: Install iCE40 toolchain (YoWASP)
        run: |
          python3 -m pip install --quiet -r ../.github/requirements-fpga.txt
          yowasp-yosys -V
          yowasp-nextpnr-ice40 --version

      - name: Synthesize, place and route (iCE40HX1K)
        run: |
          set -o pipefail
          mkdir -p build
          make fpga 2>&1 | tee build/fpga.log

      - name: FPGA area and timing budget
        run: python3 tools/fpga_report.py build/fpga.log

      # The golden hash pins the exact bitstream produced by the calibrated
      # toolchain.  A mismatch means the RTL or the toolchain drifted, even if
      # the design still fits and meets timing.
      - name: Verify reproducible bitstream
        working-directory: cpu8/build
        run: sha256sum -c ../fpga/top.bin.sha256

      # The bitstream is the deliverable of this job: keep it for a month so it
      # can be flashed without re-running the (slow) toolchain.  A missing
      # bitstream means the synthesis silently produced nothing, hence the
      # strict if-no-files-found.
      - name: Upload the bitstream
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: fpga-bitstream
          path: cpu8/build/top.bin
          retention-days: 30
          if-no-files-found: error

      # When place and route fails, the short log `make fpga` prints is usually
      # not enough to tell an area overflow from a routing problem, so keep the
      # whole nextpnr log around.
      - name: Upload the nextpnr log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: fpga-log
          path: cpu8/build/fpga.log
          if-no-files-found: ignore

  # Line/toggle/FSM coverage of the RTL over the demo programs.  `make coverage`
  # enforces a 95 % line minimum (tools/coverage_report.py) and uploads the
  # annotated report as an artifact so the numbers can be tracked over time.
  # The exact percentage depends on the Verilator version (the runner has
  # 5.020, a local install is typically newer); both are above the threshold.
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: cpu8

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ verilator
          verilator --version

      - name: RTL coverage over the demo programs
        run: make coverage

      - name: Upload the annotated report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: rtl-coverage
          path: |
            cpu8/build/verilator-cov/coverage.info
            cpu8/build/verilator-cov/report/
          if-no-files-found: ignore

  # A much longer differential fuzz than the 150 programs of the `test` job.
  # It is too slow for push/PR feedback, so it only runs on the nightly cron
  # (03:00 UTC) or when a maintainer ticks `long` in the manual dispatch form.
  difftest-long:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.long == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    defaults:
      run:
        working-directory: cpu8

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: .github/requirements-ci.txt

      # pip only provides the pytest/ruff/verible pins; the fuzz itself needs
      # iverilog to simulate the RTL.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          python3 -m pip install --quiet -r ../.github/requirements-ci.txt

      - name: Long differential fuzz (RTL vs reference model)
        run: make difftest-long COUNT=10000 SEED=${{ github.run_number }}
