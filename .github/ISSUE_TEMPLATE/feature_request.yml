name: Feature request
description: Propose a new instruction, tool or project improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: Describe the need or the current limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like the project to do?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - ISA (new instructions / modes)
        - RTL (rtl/)
        - Assembler (asm/)
        - Verification tools (tools/)
        - Documentation
        - FPGA / synthesis
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other options you may have weighed up (optional).
    validations:
      required: false
  - type: checkboxes
    id: compatibility
    attributes:
      label: Compatibility
      options:
        - label: The proposal stays backward-compatible (existing `.hex` files do not change byte-for-byte).
          required: false
