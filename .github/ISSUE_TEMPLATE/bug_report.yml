name: Bug report
description: Report incorrect behaviour in the CPU, the assembler or the tools.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill in this report. The more concrete
        the reproduction, the easier it will be to fix.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happens? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands, `.asm` program or sequence that triggers the failure.
      placeholder: |
        1. cd cpu8
        2. make test
        3. ...
      render: shell
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      multiple: true
      options:
        - RTL (rtl/)
        - Testbenches (tb/)
        - Assembler (asm/)
        - Disassembler (tools/disasm.py)
        - Reference model / ISS (tools/iss.py)
        - Difftest / regress
        - Documentation
        - CI
        - Other
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Error messages, trace output or `make` output.
      render: shell
    validations:
      required: false
  - type: input
    id: versions
    attributes:
      label: Environment versions
      description: Versions of iverilog, verilator, python3 (if relevant).
      placeholder: "iverilog 12.0, verilator 5.x, python 3.12"
    validations:
      required: false
