# Dependabot configuration.
#
# Two ecosystems are tracked:
#   * github-actions: the workflow pins every action to a full commit SHA, so
#     Dependabot is the mechanism that keeps those pins current.  It rewrites
#     the SHA and the trailing `# vX.Y.Z` comment.
#   * pip: the CI dependency files live in /.github (requirements-ci.txt,
#     requirements-formal.txt, requirements-fpga.txt).  The formatter, FPGA
#     and formal pins are calibrated for reproducible output, so they are
#     ignored below and bumped by hand with the corresponding checks.
#
# Minor and patch bumps are grouped into a single PR per ecosystem to keep the
# noise down; major bumps arrive as individual PRs and are reviewed by hand.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/.github"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # verible formats the Verilog sources: a new version needs `make fmt`
      # and a full fmt-check review.
      - dependency-name: "verible"
      # The FPGA area/timing and the exact bitstream are calibrated against
      # these wheels; bump them only after `make fpga-check` and `make fpga-repro`.
      - dependency-name: "yowasp-yosys"
      - dependency-name: "yowasp-nextpnr-ice40"
      # The formal proofs are part of the verification baseline.
      - dependency-name: "z3-solver"
    groups:
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
